# Azure uploader — nginx blocks for cloudgene.qcif.edu.au
#
# NOT APPLIED. This is a snippet for the operator to paste into
# config/nginx-vhost.conf (and into the live /etc/nginx/sites-available
# file it mirrors), inside the `server { listen 443 ssl; ... }` block, ABOVE
# the `location / { ... }` Cloudgene proxy.
#
# nginx prefix matching picks the longest match, so `/uploads/` wins over
# `/` regardless of order; placing these above the Cloudgene block is for
# readability and to match the existing /validation/ pattern in the file.
#
# Replace @REPO_ROOT@ below with the confirmed checkout path (see
# deploy/README.md §0) before pasting — nginx does not expand it.
#
# To apply:
#     sudo nginx -t && sudo systemctl reload nginx
#
# Prerequisites:
#   - uploads.service running and listening on 127.0.0.1:8003
#     (port confirmed free — Task 1 runbook, B8)
#   - the SPA built with base '/uploads/' into uploader/client/dist/
#
# Note there is no client_max_body_size here, unlike /validation/api/.
# That is the point of the design: the file bytes go straight from the
# browser to *.blob.core.windows.net and never traverse nginx.

# Azure uploader API
location /uploads/api/ {
    # The trailing slash strips the /uploads/api prefix, so FastAPI sees
    # POST /uploads for POST /uploads/api/uploads. The app sets
    # root_path="/uploads/api" to compensate in generated URLs and OpenAPI.
    proxy_pass http://127.0.0.1:8003/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Interactive docs and the OpenAPI schema expose no data and no
# credentials, but they do advertise the full API surface to anyone on the
# internet, and nothing about the design needs them in production.
# Blocking here is a single, trivially reversible location — re-enabling
# them for debugging is deleting this block and reloading, versus a code
# change and a deploy if they were disabled in the app instead. Recommended
# and applied; if a debugging session needs them, comment this block out,
# `nginx -t && systemctl reload nginx`, and remember to put it back.
location ~ ^/uploads/api/(docs|redoc|openapi\.json)$ {
    return 404;
}

# Azure uploader SPA
location /uploads/assets/ {
    alias @REPO_ROOT@/uploader/client/dist/assets/;
    # Vite content-hashes these filenames (index-DJPa0nXY.js), so the same
    # URL never means different bytes — safe to cache forever.
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# index.html is unhashed and names the hashed asset files by name. Without
# this, a returning user can get yesterday's index.html pointing at an
# asset filename that no longer exists after an upgrade — the app loads
# blank with a 404 in the console. This is invisible on a first deploy and
# only appears on the second one. An exact-match (`=`) location outranks
# the prefix match below regardless of declaration order, so this also
# covers the try_files fallback, not just a direct request for the file.
location = /uploads/index.html {
    alias @REPO_ROOT@/uploader/client/dist/index.html;
    add_header Cache-Control "no-store";
}

location /uploads/ {
    alias @REPO_ROOT@/uploader/client/dist/;
    try_files $uri $uri/ /uploads/index.html;
}
