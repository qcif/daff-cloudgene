server {
    server_name cloudgene.qcif.edu.au;

    # -------------------------------------------------------------------------
    # Taxodactyl input validation app
    location /validation/api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    location /validation/ {
        alias /mnt/data/taxodactyl_repo/services/input_validation/client/dist/;
        try_files $uri $uri/ /validation/index.html;
    }


    # -------------------------------------------------------------------------
    # Azure uploader API
    location /uploads/api/ {
        proxy_pass http://127.0.0.1:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/uploads/api/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    # Azure uploader SPA
    location /uploads/assets/ {
        alias /mnt/data/daff-cloudgene/uploader/client/dist/assets/;
        # Vite content-hashes these filenames (index-DJPa0nXY.js), so the same
        # URL never means different bytes — safe to cache forever.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /uploads/index.html {
        alias /mnt/data/daff-cloudgene/uploader/client/dist/index.html;
        add_header Cache-Control "no-store";
    }

    location /uploads/ {
        alias /mnt/data/daff-cloudgene/uploader/client/dist/;
        try_files $uri $uri/ /uploads/index.html;
    }


    # -------------------------------------------------------------------------
    # Cloudgene
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cloudgene.qcif.edu.au/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cloudgene.qcif.edu.au/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {

    if ($host = cloudgene.qcif.edu.au) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name cloudgene.qcif.edu.au;
    listen 80;
    return 404; # managed by Certbot

}
