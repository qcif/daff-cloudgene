# needrestart override for cloudgene.qcif.edu.au
# Symlinked to /etc/needrestart/conf.d/cloudgene.conf (see README.md)
#
# Never auto-restart Cloudgene after library upgrades (e.g. from
# unattended-upgrades): a restart kills running Nextflow jobs, which Cloudgene
# then shows as "pending". Restart it manually when no jobs are running.
$nrconf{override_rc}{qr(^cloudgene\.service$)} = 0;
